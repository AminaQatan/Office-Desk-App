<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>شاشة المكتب</title>
<meta name="apple-mobile-web-app-title" content="شاشة المكتب">
<meta name="theme-color" content="#3D405B">

<link rel="manifest" href="./manifest.webmanifest">
<link rel="preload" href="./readex-pro.woff2" as="font" type="font/woff2" crossorigin>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="شاشة المكتب">

<!--
  شاشة المكتب: صفحة واحدة تشتغل على أي متصفح، بدون إنترنت (حتى الخط محفوظ داخله).
  عدّل الإعدادات تحت (داخل desk-config) أو من زر ⚙️ داخل الشاشة نفسها.
  البيانات (المهام، الملاحظات، التسجيلات، الملفات، الإعدادات) تنحفظ في متصفح جهازك فقط، ومن الإعدادات تقدر تحفظ نسخة احتياطية.
-->
<script id="desk-config" type="application/json">
{
  "name": "",
  "city": "muscat",
  "method": "uq",
  "pages": [
    "time",
    "tasks",
    "notes",
    "focus",
    "adhkar"
  ],
  "palette": "navy",
  "font": "Readex Pro",
  "clock": "12",
  "focus": [
    25,
    5
  ],
  "theme": "auto"
}
</script>
<style>
/* Layout: one portrait page at a time (time, tasks, focus, adhkar) with a tab bar at the bottom. Colors come from the chosen palette and switch light/dark with the time of day. */
/* The one font of the app: Readex Pro (SIL Open Font License 1.1, see OFL.txt), kept next to index.html so every page, button,
   note and greeting card looks the same on every device, online or offline. Same three weights the original loaded:
   300 and 500 draw as 400, 600 as 700, 800 as the font's boldest. */
@font-face{font-family:"Readex Pro";src:url(./readex-pro.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Readex Pro";src:url(./readex-pro.woff2) format("woff2");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"Readex Pro";src:url(./readex-pro.woff2) format("woff2");font-weight:800;font-style:normal;font-display:swap}
:root{--u:min(1vw,.5625vh);--f:"Readex Pro","IBM Plex Sans Arabic","Geeza Pro",system-ui,sans-serif;
  --bg:#FDF6EC;--surface:#FFFDF8;--card:#F4EADB;--fg:#2B2D42;--muted:#6B6D80;--line:#E7DCCB;--accent:#E07A5F;--accentInk:#B8553C;--accentFg:#fff;
  --gold:#F2CC8F;--goldInk:#8E6A22;--ok:#4F8A6E;--hero:#3D405B;--heroFg:#FDF6EC;--heroMuted:#C9CADB;--heroTrack:rgba(253,246,236,.16);--olive:#81B29A}
*{box-sizing:border-box}
html,body,#app{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f);overflow:hidden;transition:background .8s,color .8s;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}
.shell{height:100%;max-width:calc(var(--u)*100);margin:0 auto;display:flex;flex-direction:column;gap:calc(var(--u)*3);
  padding:calc(env(safe-area-inset-top,0px) + max(14px,calc(var(--u)*4))) max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + max(12px,calc(var(--u)*3))) max(18px,env(safe-area-inset-left,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.mini{font-size:max(14px,calc(var(--u)*3.6));color:var(--muted);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;min-width:0}
.mini b{color:var(--fg);font-size:max(18px,calc(var(--u)*5))}
.mini .np{color:var(--accentInk);font-weight:700}
.topr{display:flex;gap:8px;align-items:center;margin-inline-start:auto}
.icon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--muted)}
.icon:hover{background:var(--card);color:var(--fg)}
.icon svg{width:22px;height:22px}
.pill{white-space:nowrap;min-height:36px;padding:0 14px;border-radius:99px;background:var(--card);font-size:14px;font-weight:700}
.banner{background:var(--accent);color:var(--accentFg);border-radius:18px;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.banner b{font-size:max(17px,calc(var(--u)*4.6));flex:1;min-width:0}
.banner button{min-height:40px;padding:0 14px;border-radius:12px;background:rgba(255,255,255,.22);font-weight:700;font-size:14px}
.page{flex:1;min-height:0;display:flex;flex-direction:column;gap:calc(var(--u)*3.2);overflow-y:auto;overflow-x:hidden;scrollbar-width:none;animation:in .35s ease;touch-action:pan-y}
.page::-webkit-scrollbar{display:none}
@keyframes in{from{opacity:.25;transform:translateY(6px)}to{opacity:1;transform:none}}
.lbl{font-size:max(13px,calc(var(--u)*3.2));font-weight:700;color:var(--muted)}
/* time */
.clock{font-weight:800;font-size:calc(var(--u)*22);line-height:.95;display:flex;align-items:baseline;gap:calc(var(--u)*2)}
.clock small{font-size:calc(var(--u)*7);font-weight:700;color:var(--muted)}
.date{font-size:max(16px,calc(var(--u)*4.6));color:var(--muted)}
.date b{color:var(--fg)}
.hero{background:var(--hero);color:var(--heroFg);border-radius:calc(var(--u)*5);padding:calc(var(--u)*4.5) calc(var(--u)*5);display:flex;flex-direction:column;gap:calc(var(--u)*1.6)}
.hero .lbl{color:var(--heroMuted)}
.nname{font-weight:800;font-size:calc(var(--u)*13);line-height:1.05;color:var(--gold)}
.nrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;font-size:max(17px,calc(var(--u)*5.4))}
.nrow .left{color:var(--heroMuted)}
.bar{height:max(6px,calc(var(--u)*1.4));border-radius:99px;background:var(--heroTrack);overflow:hidden;margin-top:calc(var(--u)*1.5)}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:var(--gold);transition:width 1s linear}
.ptable{list-style:none;margin:0;padding:0}
.ptable li{display:flex;justify-content:space-between;align-items:baseline;padding:calc(var(--u)*2) calc(var(--u)*1);border-bottom:1px solid var(--line);font-size:max(17px,calc(var(--u)*5.2))}
.ptable li:last-child{border-bottom:0}
.ptable .t{font-weight:700}
.ptable li.past{color:var(--muted)}
.ptable li.past .t{font-weight:400}
.ptable li.next{color:var(--accentInk);font-weight:700}
.ptable li.next span:first-child::before{content:"";display:inline-block;width:.5em;height:.5em;border-radius:50%;background:var(--accent);margin-inline-end:.45em;vertical-align:.12em}
.ptable small{font-size:.6em;color:var(--muted);font-weight:400;margin-inline-start:.3em}
/* tasks */
.now{background:var(--surface);border:1.5px solid var(--line);border-radius:calc(var(--u)*5);padding:calc(var(--u)*5);display:flex;flex-direction:column;gap:calc(var(--u)*2);box-shadow:0 1px 2px rgba(0,0,0,.04),0 14px 36px rgba(0,0,0,.06)}
.now h2{margin:0;font-weight:800;font-size:max(22px,calc(var(--u)*7));line-height:1.25;overflow-wrap:anywhere;text-wrap:balance}
.now p{margin:0;color:var(--muted);font-size:max(15px,calc(var(--u)*4))}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{min-height:max(48px,calc(var(--u)*10.5));padding:0 calc(var(--u)*3.6);border-radius:calc(var(--u)*3.4);font-weight:700;font-size:max(15px,calc(var(--u)*4.2));background:var(--card);display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accentFg)}
.btn.line{background:transparent;border:1.5px solid var(--line)}
.btn.grow{flex:1}
.list{display:flex;flex-direction:column;background:var(--surface);border:1.5px solid var(--line);border-radius:calc(var(--u)*4);overflow:hidden}
.task{display:flex;align-items:center;gap:calc(var(--u)*3);padding:calc(var(--u)*3) calc(var(--u)*3.5);border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.chk{flex:none;width:max(34px,calc(var(--u)*8));height:max(34px,calc(var(--u)*8));border-radius:50%;border:2.5px solid var(--line);display:grid;place-items:center;color:transparent}
.chk:hover{border-color:var(--ok);color:var(--ok)}
.chk svg{width:55%;height:55%}
.ttl{flex:1;min-width:0;font-size:max(16px,calc(var(--u)*4.6));font-weight:700;overflow-wrap:anywhere}
.del{flex:none;width:40px;height:40px;border-radius:12px;color:var(--muted);font-size:20px}
.del:hover{background:var(--card)}
.add{display:flex;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:calc(var(--u)*4);padding:6px}
.add input{flex:1;min-width:0;border:0;background:transparent;padding:10px 12px;outline:none;font-size:max(16px,calc(var(--u)*4.2))}
.donechip{align-self:flex-start;font-size:14px;font-weight:700;color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent);border-radius:99px;padding:3px 12px}
/* focus */
.focus{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*4);text-align:center}
.ring{position:relative;width:min(calc(var(--u)*80),62vh);aspect-ratio:1;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{stroke:var(--card)}
.ring .val{stroke:var(--accent);transition:stroke-dashoffset 1s linear}
.ring.brk .val{stroke:var(--olive)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*1)}
.ftime{font-weight:800;font-size:calc(var(--u)*19);line-height:1}
.fphase{font-size:max(15px,calc(var(--u)*4.4));color:var(--muted);font-weight:700}
.ftask{font-size:max(16px,calc(var(--u)*4.6));font-weight:700;max-width:90%;overflow-wrap:anywhere}
.fcount{font-size:max(13px,calc(var(--u)*3.4));color:var(--muted)}
/* adhkar */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--card);padding:5px;border-radius:16px}
.seg button{min-height:44px;border-radius:12px;font-weight:700;font-size:max(15px,calc(var(--u)*4));color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.dcard{flex:1;min-height:0;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:calc(var(--u)*5);padding:calc(var(--u)*5);display:flex;flex-direction:column;gap:calc(var(--u)*3);text-align:start;overflow:hidden}
.dwrap{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none}
.dwrap::-webkit-scrollbar{display:none}
.dtext{font-size:max(17px,calc(var(--u)*5.2));line-height:1.95}
.dtext.q{font-weight:700}
.dtext .am{color:var(--accentInk);font-size:.8em;white-space:nowrap}
.dtext .basm{display:block;color:var(--muted);font-size:.85em;margin-bottom:.3em;font-weight:700}
.dfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex:none}
.count{width:max(64px,calc(var(--u)*17));height:max(64px,calc(var(--u)*17));border-radius:50%;background:var(--accent);color:var(--accentFg);display:grid;place-items:center;font-weight:800;font-size:max(24px,calc(var(--u)*7.5));flex:none}
.hint{font-size:max(13px,calc(var(--u)*3.4));color:var(--muted)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.d{background:var(--olive)}
.dots i.c{background:var(--accent)}
.fin{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*3);text-align:center}
.fin h2{font-size:calc(var(--u)*11);margin:0;color:var(--ok)}
/* nav */
.nav{display:grid;gap:6px;background:var(--card);border-radius:20px;padding:6px}
.nav button{min-height:max(48px,calc(var(--u)*11));border-radius:15px;font-weight:700;font-size:max(14px,calc(var(--u)*3.8));color:var(--muted)}
.nav button[aria-current="page"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.1)}
/* overlay + sheet */
.start{position:fixed;inset:0;z-index:30;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;padding:24px 18px}
.startc{background:var(--surface);border:1.5px solid var(--line);border-radius:28px;padding:28px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:14px;text-align:center}
.startc h1{font-size:32px;margin:0;line-height:1.25}
.startc p{margin:0;color:var(--muted);font-size:16px;line-height:1.7}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40}
.sheet{position:fixed;z-index:41;inset-inline:0;bottom:0;margin:0 auto;max-width:620px;max-height:92%;overflow-y:auto;background:var(--surface);color:var(--fg);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h2{font-size:20px;margin:0 0 14px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label,.field>.lab{font-size:13px;font-weight:700;color:var(--muted)}
.field input,.field select{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{min-height:38px;padding:0 12px;border-radius:10px;background:var(--bg);border:1.5px solid var(--line);font-size:14px}
.chips button[aria-pressed="true"]{border-color:var(--accent);color:var(--accentInk);font-weight:700;background:color-mix(in srgb,var(--accent) 12%,transparent)}
.adj div{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.adj div:last-child{border-bottom:0}
.adj .ctl{display:flex;align-items:center;gap:8px;border:0;padding:0}
.adj .ctl button{width:38px;height:38px;border-radius:10px;background:var(--card);font-size:18px;font-weight:700}
.adj .ctl span{min-width:58px;text-align:center;font-weight:700}
.note{font-size:13px;color:var(--muted);margin:2px 0 0}
.toast{position:fixed;z-index:50;inset-inline:16px;bottom:calc(110px + env(safe-area-inset-bottom,0px));margin:0 auto;max-width:440px;background:var(--fg);color:var(--bg);border-radius:14px;padding:12px 16px;font-size:15px;opacity:0;transform:translateY(10px);transition:all .2s;pointer-events:none;text-align:center}
.toast.show{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===== «الجو»: scene layer + sheet. Every class starts with amb- so nothing collides with the host.
   Colors follow the host: Bousla desk tokens (--dk-*) first, then the standalone palette tokens, then fixed fallbacks. ===== */
.amb-root,.amb-sheet{
  --amb-bg:var(--dk-bg,var(--bg,#FDF6EC));--amb-s:var(--dk-surface,var(--surface,#FFFDF8));--amb-card:var(--dk-card,var(--card,#F4EADB));
  --amb-fg:var(--dk-fg,var(--fg,#2B2D42));--amb-muted:var(--dk-muted,var(--muted,#6B6D80));--amb-line:var(--dk-line,var(--line,#E7DCCB));
  --amb-accent:var(--dk-accent,var(--accent,#E07A5F));--amb-accent-ink:var(--dk-accent-ink,var(--accentInk,#B8553C));--amb-accent-fg:var(--dk-accent-fg,var(--accentFg,#FFFFFF));
  --amb-gold:var(--dk-gold,var(--gold,#F2CC8F));--amb-f:var(--dk-f,var(--f,"IBM Plex Sans Arabic","Readex Pro","Geeza Pro",system-ui,sans-serif))}

/* scene layer: fills the mount, never takes clicks */
.amb-root{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:#05060c;opacity:0;visibility:hidden;transition:opacity .7s ease,visibility 0s linear .7s}
.amb-root.amb-on{opacity:1;visibility:visible;transition:opacity .7s ease}
.amb-media,.amb-shade,.amb-dimmer{position:absolute;inset:0}
.amb-cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.amb-img,.amb-vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;max-width:none}
.amb-yt{position:absolute;inset:0;overflow:hidden;background:#0b0d18}
.amb-yt iframe{position:absolute;left:50%;top:50%;border:0;transform:translate(-50%,-50%);pointer-events:none;max-width:none}
.amb-hide{display:none!important}
/* a little shade at the top and bottom so the host's bars stay readable on bright pictures */
.amb-shade{background:linear-gradient(rgba(0,0,0,.30),rgba(0,0,0,0) 20%,rgba(0,0,0,0) 72%,rgba(0,0,0,.34))}
.amb-root[data-kind="canvas"] .amb-shade{opacity:.55}
/* behind the other pages: heavily dimmed toward the host background */
.amb-dimmer{background:rgba(14,16,30,.84);background:color-mix(in srgb,var(--amb-bg) 84%,transparent);opacity:0;transition:opacity .7s ease}
.amb-root.amb-dim .amb-dimmer{opacity:1}

/* helpers for the host's focus page while a scene shows behind it */
.amb-glass{background:rgba(255,255,255,.07);-webkit-backdrop-filter:blur(16px) saturate(1.15);backdrop-filter:blur(16px) saturate(1.15);border:1px solid rgba(255,255,255,.16);color:#fff}
.amb-ink{color:#fff;text-shadow:0 1px 14px rgba(0,0,0,.4)}

/* ---------- sheet ---------- */
.amb-scrim{position:fixed;inset:0;z-index:44;background:rgba(0,0,0,.42);animation:amb-fade .2s ease}
.amb-sheet{position:fixed;z-index:45;inset-inline:0;bottom:0;margin:0 auto;width:100%;max-width:620px;max-height:92%;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
  background:var(--amb-s);color:var(--amb-fg);font-family:var(--amb-f);font-size:15px;line-height:1.6;text-align:start;
  border-radius:22px 22px 0 0;padding:16px 18px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -12px 40px rgba(0,0,0,.2);animation:amb-up .26s ease;box-sizing:border-box}
.amb-sheet *,.amb-sheet *::before,.amb-sheet *::after{box-sizing:border-box}
.amb-sheet:focus{outline:none}
.amb-sheet.amb-inline{position:relative;z-index:auto;inset:auto;max-width:none;max-height:none;overflow:visible;border-radius:22px;border:1.5px solid var(--amb-line);box-shadow:none;animation:none;padding-bottom:16px}
@keyframes amb-up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@keyframes amb-fade{from{opacity:0}to{opacity:1}}
.amb-sheet button,.amb-sheet input,.amb-sheet a{font:inherit;color:inherit}
.amb-sheet button{cursor:pointer;border:0;background:none;padding:0;margin:0;text-align:inherit}
.amb-sheet :focus-visible{outline:2px solid var(--amb-accent);outline-offset:2px;border-radius:10px}
.amb-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px}
.amb-title{margin:0;font-size:21px;font-weight:800;line-height:1.3}
.amb-x{flex:none;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--amb-card);color:var(--amb-fg)}
.amb-x svg{width:20px;height:20px}
.amb-sec{display:flex;flex-direction:column;gap:10px;padding:14px 0;border-top:1px solid var(--amb-line)}
.amb-head+.amb-sec{border-top:0;padding-top:8px}
.amb-h{margin:0;font-size:13px;font-weight:700;color:var(--amb-muted);letter-spacing:.01em}
.amb-note{margin:0;font-size:13px;color:var(--amb-muted);line-height:1.7}
.amb-warn{margin:0;font-size:13px;line-height:1.7;font-weight:700;color:var(--amb-accent-ink);background:color-mix(in srgb,var(--amb-accent) 12%,transparent);border-radius:10px;padding:8px 10px}
.amb-foot{padding-top:12px;border-top:1px solid var(--amb-line)}

/* scene cards */
.amb-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:8px}
.amb-card{display:flex;flex-direction:column;min-width:0;border-radius:14px;overflow:hidden;background:var(--amb-bg);border:1.5px solid var(--amb-line);transition:border-color .15s,box-shadow .15s}
.amb-sheet .amb-card{text-align:start}
.amb-card[aria-pressed="true"],.amb-card[aria-expanded="true"]{border-color:var(--amb-accent);box-shadow:0 0 0 1.5px var(--amb-accent)}
.amb-card[aria-pressed="true"] .amb-nm,.amb-card[aria-expanded="true"] .amb-nm{color:var(--amb-accent-ink)}

const PR_KEYS=['fajr','dhuhr','asr','maghrib','isha'];
const PR_NAMES={fajr:'الفجر',sunrise:'الشروق',dhuhr:'الظهر',asr:'العصر',maghrib:'المغرب',isha:'العشاء'};
const rad=d=>d*Math.PI/180,deg=r=>r*180/Math.PI;
const fixA=(a,b)=>{a=a-b*Math.floor(a/b);return a<0?a+b:a};
function julian(y,m,d){if(m<=2){y--;m+=12}const A=Math.floor(y/100),B=2-A+Math.floor(A/4);return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5}
function sunPos(jd){const D=jd-2451545,g=fixA(357.529+.98560028*D,360),q=fixA(280.459+.98564736*D,360),L=fixA(q+1.915*Math.sin(rad(g))+.02*Math.sin(rad(2*g)),360),e=23.439-.00000036*D;
  const RA=deg(Math.atan2(Math.cos(rad(e))*Math.sin(rad(L)),Math.cos(rad(L))))/15;return{decl:deg(Math.asin(Math.sin(rad(e))*Math.sin(rad(L)))),eqt:q/15-fixA(RA,24)}}
function prayerHours(y,m,d,c,meth){
  const jd=julian(y,m,d)-c.lng/(15*24),mid=t=>fixA(12-sunPos(jd+t).eqt,24);
  const ang=(a,t,ccw)=>{const dc=sunPos(jd+t).decl,n=mid(t);const v=deg(Math.acos((-Math.sin(rad(a))-Math.sin(rad(dc))*Math.sin(rad(c.lat)))/(Math.cos(rad(dc))*Math.cos(rad(c.lat)))))/15;return n+(ccw?-v:v)};
  const asr=t=>{const dc=sunPos(jd+t).decl;return ang(-deg(Math.atan(1/(1+Math.tan(rad(Math.abs(c.lat-dc)))))),t,false)};
  let t={fajr:5/24,sunrise:6/24,dhuhr:.5,asr:13/24,maghrib:.75,isha:.75},r;
  for(let i=0;i<2;i++){r={fajr:ang(meth.fajr,t.fajr,true),sunrise:ang(.833,t.sunrise,true),dhuhr:mid(t.dhuhr),asr:asr(t.asr),maghrib:ang(.833,t.maghrib,false)};
    r.isha=meth.ishaMin?r.maghrib+meth.ishaMin/60:ang(meth.isha,t.isha,false);t={};for(const k in r)t[k]=r[k]/24}
  const out={};for(const k in r)out[k]=r[k]+c.tz-c.lng/15;return out;
}
const cache={};
function dayPrayers(off){
  const c=city(),n=new Date(Date.now()+c.tz*36e5),base=Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate()+off),b=new Date(base),day=b.toISOString().slice(0,10);
  const key=day+JSON.stringify(ST);if(cache[key])return cache[key];
  const h=prayerHours(b.getUTCFullYear(),b.getUTCMonth()+1,b.getUTCDate(),c,METHODS[ST.method]);const o={day,friday:b.getUTCDay()===5};
  for(const k in h)o[k]=Math.round((base+(h[k]-c.tz)*36e5+(ST.adj[k]||0)*6e4)/6e4)*6e4;
  return cache[key]=o;
}
function prayerState(){const now=Date.now(),T=dayPrayers(0);let next=null,prev=null;
  for(const k of PR_KEYS)if(T[k]>now){next={k,t:T[k]};break}
  if(!next)next={k:'fajr',t:dayPrayers(1).fajr,tomorrow:true};
  for(const k of [...PR_KEYS].reverse())if(T[k]<=now){prev={k,t:T[k]};break}
  if(!prev)prev={k:'isha',t:dayPrayers(-1).isha};return{now,T,next,prev}}
const prName=(k,T)=>k==='dhuhr'&&T&&T.friday?'الجمعة':PR_NAMES[k];
function hm(ms){const s=new Date(ms+city().tz*36e5);let h=s.getUTCHours();const m=s.getUTCMinutes();
  if(ST.clock==='24')return{t:pad(h)+':'+pad(m),s:''};const pm=h>=12;h=h%12||12;return{t:h+':'+pad(m),s:pm?'م':'ص'}}
const minP=m=>m===1?'دقيقة':m===2?'دقيقتين':m<=10?m+' دقايق':m+' دقيقة';
const hourP=h=>h===1?'ساعة':h===2?'ساعتين':h<=10?h+' ساعات':h+' ساعة';
function until(ms){const mins=Math.ceil(Math.max(0,ms)/6e4);if(mins<1)return 'الحين';const h=Math.floor(mins/60),m=mins%60;return 'بعد '+(h?hourP(h)+(m?' و'+minP(m):''):minP(m))}

function occToday(){const k=occKey();if(OCCD.key!==k)OCCD={key:k,list:occOnDay(nowDayMs()),next:undefined};return OCCD.list}
function occNext(){occToday();if(OCCD.next!==undefined)return OCCD.next;const t0=nowDayMs();let best=null;
  for(let k=1;k<=400&&!best;k++){const t=t0+k*DAYMS,g=gInfo(t),gp=gInfo(t-DAYMS);
    for(const o of OCC){if(o.nc||!occEnabled(o))continue;if(o.t(g)&&!o.t(gp)&&(!best||o.pr>best.o.pr))best={o,t,days:k}}}
  return OCCD.next=best}

function rgba(hex,a){const n=parseInt(String(hex).slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
const SPR=new Map();
function emojiSprite(ch,px){const k=ch+px;if(SPR.has(k))return SPR.get(k);const c=document.createElement('canvas'),s=Math.ceil(px*1.3);c.width=c.height=s;const x=c.getContext('2d');
  x.font=px+'px '+EMOJI_FONT;x.textAlign='center';x.textBaseline='middle';x.fillText(ch,s/2,s/2+px*.05);SPR.set(k,c);return c}
function seeded(seed){let s=seed>>>0||1;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function star4(x,cx,cy,r){x.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,rr=i%2?r*.38:r;x.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr)}x.closePath();x.fill()}
function crescent(x,cx,cy,r,col){const sz=Math.ceil(r*4),m=sz/2,c=document.createElement('canvas');c.width=c.height=sz;const y=c.getContext('2d');   // drawn apart so the cut never erases the wash below
  y.fillStyle=col;y.shadowColor=col;y.shadowBlur=r*.7;y.beginPath();y.arc(m,m,r,0,Math.PI*2);y.fill();y.shadowBlur=0;y.globalCompositeOperation='destination-out';y.beginPath();y.arc(m+r*.45,m-r*.25,r*.85,0,Math.PI*2);y.fill();x.drawImage(c,cx-m,cy-m)}
function lantern(x,cx,top,len,s,col,glow){x.save();x.strokeStyle=rgba(col,.55);x.lineWidth=1.2*s;x.beginPath();x.moveTo(cx,0);x.lineTo(cx,top+len);x.stroke();
  const y=top+len;const g=x.createRadialGradient(cx,y+20*s,2,cx,y+20*s,36*s);g.addColorStop(0,rgba(glow,.55));g.addColorStop(1,rgba(glow,0));x.fillStyle=g;x.beginPath();x.arc(cx,y+20*s,36*s,0,Math.PI*2);x.fill();

  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title,text});return true}}catch(e){if(e&&e.name==='AbortError')return true}

  if(k==='t'&&x.time&&remMs(d+'T'+x.time)>Date.now()+6e4)return [d,x.time];   /* the task's own time, while it is still ahead */
  if(d!==td)return [d,'09:00'];
  /* otherwise the next full hour that is at least half an hour away (it may be tomorrow) */
  const l=new Date(Math.ceil((Date.now()+city().tz*36e5+18e5)/36e5)*36e5).toISOString();return [l.slice(0,10),l.slice(11,16)]}

const icsText=s=>String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
function icsFold(line){const enc=new TextEncoder(),out=[];let cur='',n=0;   /* lines of at most 75 bytes, as calendars expect */
  for(const ch of line){const b=enc.encode(ch).length;if(n+b>74){out.push(cur);cur=' ';n=1}cur+=ch;n+=b}out.push(cur);return out.join('\r\n')}

  if(wd===5&&mins>=9*60&&mins<9*60+2&&!S.fired[st.T.day+'kahf']){S.fired[st.T.day+'kahf']=1;nudge('📖 جمعة مباركة، وقت سورة الكهف',6e5);return true}

const SRC=window.SpeechRecognition||window.webkitSpeechRecognition;
const DICT={r:null};
function dictate(id,btn){if(DICT.r){try{DICT.r.stop()}catch(e){}return}
  if(!SRC){toast('الإملاء الصوتي غير مدعوم هنا. استخدمي ميكروفون لوحة المفاتيح');return}
  const el=document.getElementById(id);if(!el)return;const r=new SRC();r.lang=ST.dict==='en'?'en-US':'ar-SA';r.interimResults=true;r.continuous=false;
  const base=el.value?el.value.replace(/\s*$/,' '):'';
  r.onresult=e=>{let s='';for(let i=0;i<e.results.length;i++)s+=e.results[i][0].transcript;el.value=(base+s).slice(0,el.maxLength>0?el.maxLength:20000);el.dispatchEvent(new Event('input',{bubbles:true}))};
  r.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed')toast('اسمحي باستخدام الميكروفون للإملاء');else if(e.error!=='no-speech'&&e.error!=='aborted')toast('ما قدرت أسمع، جرّبي مرة ثانية')};
  r.onend=()=>{DICT.r=null;document.querySelectorAll('[data-a="dict"]').forEach(b=>b.classList.remove('live'))};
  DICT.r=r;try{r.start();if(btn)btn.classList.add('live')}catch(e){DICT.r=null}}
const SPK={on:false};
function setSpeakBtn(on){document.querySelectorAll('[data-a="speak"]').forEach(b=>{b.textContent=on?'⏹ أوقفي القراءة':'🔊 اقرأ لي'})}
function speak(text){stopSpeak();if(!('speechSynthesis' in window)){toast('القراءة الصوتية غير مدعومة هنا');return}
  text=String(text||'').replace(/\s+/g,' ').trim();if(!text){toast('ما فيه نص للقراءة');return}
  const arN=(text.match(/[؀-ۿ]/g)||[]).length,enN=(text.match(/[A-Za-z]/g)||[]).length,ar=arN>=enN;
  const vs=speechSynthesis.getVoices(),v=vs.find(z=>z.lang&&z.lang.toLowerCase().startsWith(ar?'ar':'en'));
  const parts=text.match(/[^.!?؟\n]{1,200}(?:[.!?؟\n]|$)|[^.!?؟\n]{200}/g)||[text];
  parts.forEach((p,i)=>{const u=new SpeechSynthesisUtterance(p);u.lang=v?v.lang:(ar?'ar-SA':'en-US');if(v)u.voice=v;if(i===parts.length-1)u.onend=()=>{SPK.on=false;setSpeakBtn(false)};speechSynthesis.speak(u)});
  SPK.on=true;setSpeakBtn(true)}
function stopSpeak(){try{window.speechSynthesis&&speechSynthesis.cancel()}catch(e){}SPK.on=false;setSpeakBtn(false)}

function tick(fromRender){

}

/* ==========================================================================
   «الجو» v3 : focus ambience engine, shared by desk-screen.html and Bousla #desk
   --------------------------------------------------------------------------
   Paste this text INSIDE the host app's closure, and ambience.css inside its
   <style>. It defines exactly one function, createAmbience(opts). It touches
   nothing global except: the mount element it is given, the sheet container,
   its own localStorage key (opts.store), its own IndexedDB database
   (same name, object store 'files', keys bg / amb / mus), and while «وضع المشاهد»
   is open: one fixed layer appended to <body> and a capture keydown listener on window.

   Built-in library, so nothing has to be uploaded:
     scenes  LIB below: painted stills in two groups, «دافي» (cat:'cozy') and «طبيعة» (cat:'nature').
             Each has a tall and a wide version picked by the mount's shape, live overlays placed
             on the picture (rain on the window, candle / fire / lamp flicker, steam, embers, and
             the outdoor fx: rain, snow, stars, petals, fireflies, shimmer, mist), and optionally a
             video loop that replaces the overlays while «حركة على المشهد» is on.
             + the 4 canvas scenes + «صورتي» + «يوتيوب» (standalone only)
     sounds  AMB_LIB (30 s loops, trimmed and crossfade-baked so the loop never has a gap)
     music   MUS_LIB tracks, or «بالتناوب» (mus:'alt': every MUS_LIB track in turn with a
             crossfade, starting with the scene's `first`)
     thunder «رعد أحيانًا»: a random thunder one-shot every 60–180 s, a soft
             lightning flash on the scene a moment before.
   AMB_LIB / MUS_LIB / LIB may grow to any length. Picking a scene card applies its suggested
   sounds (the person can change them). Music never restarts when the new list has the same set
   of tracks (only the starting one differs): it keeps playing and only the ambience crossfades.

   LIB entry (all coordinates are fractions 0..1 of the PICTURE, x,y from its top-left):
     key:{name:'<Arabic name>', cat:'cozy'|'nature', amb:'<AMB_LIB id>', mus:'alt'|'<MUS_LIB id>',
          first:'<MUS_LIB id that starts>', thunder:false|true,
          tall:{img:'scene-<key>.jpg', vid?:'scene-<key>.mp4', win?:[x,y,w,h],
                lights?:[{x,y,r,k:'candle'|'fire'|'lamp'}], steam?:[{x,y}], fx?:[{k,a:[x,y,w,h],n?}]},
          wide:{ same, with img:'scene-<key>-wide.jpg', vid?:'scene-<key>-wide.mp4' } }
     media files live under opts.media: the pictures, thumb-<key>.jpg (240 px tall thumb), <id>.mp3.
     win    a glass window: rain streaks + drops sliding on the glass are drawn inside it.
     lights r = glow radius as a fraction of the picture width. 'fire' also throws embers.
     steam  rim of a hot cup; wisps rise ~7% of the picture height above it.
     fx     outdoor overlays, each clipped to its area a, n = density 0..1 (default .5):
            'rain' falling streaks (no glass) · 'snow' soft flakes in 3 sizes with sway ·
            'stars' slow twinkle · 'petals' falling petals, gently turning · 'fireflies' pulsing dots ·
            'shimmer' short glints on water · 'mist' 2–3 wide soft fog bands drifting.
            Off with «حركة على المشهد»; fewer and slower with prefers-reduced-motion.
     vid    a looping clip of the same picture. Two muted <video>s crossfade 0.8 s before the end,
            so the loop is seamless even when first and last frames differ. Until it plays (or if
            it fails) the canvas overlays run instead.

   const amb = createAmbience({
     mount,          // HTMLElement the scene fills (position:fixed;inset:0 behind the page UI).
     store,          // 'ds-amb' (standalone) | 'desk-amb' (Bousla). localStorage key + IndexedDB name.
     media,          // base URL of the library files, default 'media/'.
     youtube,        // true: offer «من يوتيوب» background (standalone only).
                     // false: the sheet shows a box that opens the standalone copy instead.
     standaloneUrl,  // youtube:false only: default link of that standalone copy.
     onChange,       // fn(state), batched once per microtask.
     toast,          // optional fn(msg) for short messages while the sheet is closed.
     clock,          // optional fn() -> {t:'10:45', s:'ص'} for «وضع المشاهد» (default: device time, 12 h, ص/م).
     onShow,         // optional fn(open:boolean) when «وضع المشاهد» opens / closes.
   });

   amb.ready              Promise: resolves once saved files are read back from IndexedDB.
   amb.state              { scene, cat, kind:'none'|'scene'|'canvas'|'image'|'video'|'youtube', wide, showing, dim,
                            playing, pending, ducked, unlocked, amb, mus, thunder, motion, nowMus, vid:null|'loading'|'on',
                            hasSound, withTimer, allPages, vAmb, vMus, ytId, ytSound, audio, idb, sheetOpen,
                            show, rotate:0|10|20|30, clock }
   amb.setPage(isFocus)   call on every host render (focus page: full scene, others: dimmed if «في كل الصفحات»).
   amb.setVisible(bool) / amb.setDim(bool)   low level visibility.
   amb.unlock()           call SYNCHRONOUSLY inside the host's «ابدأ» click (the user gesture).
   amb.timer(running)     focus timer started / paused. Edge triggered. Obeys «يشتغل مع المؤقت».
   amb.startSound() / amb.stopSound(fade) / amb.toggleSound()
   amb.duck(on)           adhan: fade everything out (thunder too); false resumes.
   amb.openSheet(el?, {inline}) / amb.closeSheet()
   amb.setScene(key)      'none'|<LIB key>|'glass'|'room'|'storm'|'sea'|'file'|'youtube'
   amb.setYouTube(url) / amb.parseYouTube(url)
   amb.flash()            show a lightning flash now (also plays thunder when sound is on).
   amb.openShow()         «وضع المشاهد»: the scene + music on the whole screen (fixed layer, z-index 43,
                          under the «الجو» sheet at 44/45; never dimmed, whatever setPage/setDim say).
                          Call it SYNCHRONOUSLY inside a click: it unlocks audio and starts the sound.
                          Clock + scene name + «♪ track» bottom-start; controls hide after 3 s idle.
                          Keys: ← next, → previous (RTL), Space play/pause, Esc exit (or close the sheet first).
   amb.closeShow()        back to the host page; sound stops only if the show started it.

    case 'done':{const all=lsGet('ds-tasks',[])||[],t=all.find(x=>x.id===b.dataset.id);if(t){t.done=true;t.doneAt=localDay();saveTasks(all);S.skip=0;const sk=streakBump(),left=tasks().filter(x=>!x.done).length;
      if(!left){confetti(true);toast('خلصتِ كل مهام اليوم! 🎉'+(sk.count>1?' 🔥 '+sk.count+' أيام متتالية':''))}else{confetti(false);toast(['عفيه عليك، خلصتِ وحدة 👏','أحسنتِ ✨','ممتاز، كمّلي 💪'][Math.floor(Math.random()*3)])}render()}break}
    case 'undo':{const all=lsGet('ds-tasks',[])||[],t=all.find(x=>x.id===b.dataset.id);if(t){t.done=false;delete t.doneAt;saveTasks(all);render()}break}
    case 'nudge-x':S.nudge=null;render();break;
    case 'greet':greetCard(b.dataset.v);break;
    case 'tv':S.tv=b.dataset.v;S.emoOpen=false;render();break;
    case 'emo-open':S.emoOpen=!S.emoOpen;render();break;
    case 'emo':S.addEmo=b.dataset.v;S.emoOpen=false;render();document.getElementById('newtask')?.focus();break;
    case 'wadd':{S.addDay=b.dataset.v;S.clear=['newday'];render();S.clear=null;const i=document.getElementById('newtask');if(i){i.focus({preventScroll:true});i.scrollIntoView({block:'center',behavior:'smooth'})}break}
    case 'wk-share':shareText('جدول مهامي',weekText());break;
    case 'dict':dictate(b.dataset.t,b);break;
    case 'speak':{if(SPK.on){stopSpeak();break}noteFromSheet();const n=noteGet(S.edit);if(!n)break;if(n.type==='note'||n.type==='list'){speak(noteAsText(n))}else{try{speak(await noteText(n))}catch(err){toast('ما قدرت أقرأ الملف (يحتاج إنترنت أول مرة)')}}break}
    case 'n-new':noteNew(b.dataset.v);break;
    case 'n-rec':recStart();break;
    case 'rec-stop':recStop(false);break;
    case 'rec-cancel':recStop(true);break;
    case 'nf':S.nf=b.dataset.v;render();break;
    case 'n-open':openNote(b.dataset.id);break;
    case 'rem':remOpen(b.dataset.k,b.dataset.id,!!b.dataset.sheet);break;
    case 'rem-g':remGoogle();break;
    case 'rem-ics':remIcs();break;
    case 'rem-x':remClear();break;
    case 'rem-wa':remWa();break;
    case 'rem-wa-edit':remWaEdit();break;
    case 'n-share':noteShare(b.dataset.id||S.edit);break;
    case 'nl-tog':{const n=noteGet(b.dataset.id),it=n&&n.items&&n.items[+b.dataset.i];if(it){it.d=!it.d;noteUpd(n.id,{items:n.items});render()}break}
    case 'nv-play':voiceToggle(b.dataset.id);break;
    case 'ne-color':{noteUpd(S.edit,{color:b.dataset.v});b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));const ta=document.getElementById('ne-text');if(ta)ta.style.setProperty('--nc',NCOL[b.dataset.v]);break}
    case 'ne-add':{noteFromSheet();const n=noteGet(S.edit);if(!n)break;n.items=(n.items||[]).concat([{t:'',d:false}]);noteUpd(n.id,{items:n.items});const ul=document.getElementById('ne-list');ul.innerHTML=listRows(n);const ins=ul.querySelectorAll('input');if(ins.length)ins[ins.length-1].focus();break}
    case 'ne-rm':{noteFromSheet();const n=noteGet(S.edit);if(!n||!n.items)break;n.items.splice(+b.dataset.i,1);noteUpd(n.id,{items:n.items});document.getElementById('ne-list').innerHTML=listRows(n);break}
    case 'ne-tog':{noteFromSheet();const n=noteGet(S.edit),it=n&&n.items&&n.items[+b.dataset.i];if(!it)break;it.d=!it.d;noteUpd(n.id,{items:n.items});document.getElementById('ne-list').innerHTML=listRows(n);break}
    case 'n-del':{if(b.dataset.armed){const id=S.edit;S.edit=null;document.getElementById('sheetwrap')?.remove();stopSpeak();await noteDelete(id);render()}
      else{b.dataset.armed='1';b.classList.add('armed');b.textContent='اضغطي مرة ثانية للحذف';setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.classList.remove('armed');b.textContent='حذف'}},3500)}break}
    case 'bk-save':backupSave();break;
    case 'media-cache':cacheMedia();break;
    case 'del':{saveTasks((lsGet('ds-tasks',[])||[]).filter(x=>x.id!==b.dataset.id));render();break}
    case 'skip':S.skip++;render();break;
    case 'focus-start':{const f=fGet();if(!f.end){f.end=Date.now()+fLeft(f);fSet(f)}if(S.audioOK)amb().unlock();amb().timer(true);unpeek();const i=PAGES.findIndex(p=>p[0]==='focus');if(i>=0)go(i);break}
    case 'f-toggle':{const f=fGet();if(f.end){f.left=fLeft(f);f.end=null}else f.end=Date.now()+f.left;fSet(f);if(f.end&&S.audioOK)amb().unlock();amb().timer(!!f.end);unpeek();render();break}
    case 'peek':peek(true);break;
    case 'f-reset':{amb().timer(false);const f=fGet();f.end=null;f.left=f.phase==='break'?FOCUS_BREAK:FOCUS_WORK;fSet(f);render();break}
    case 'f-skip':{amb().timer(false);const f=fGet();f.phase=f.phase==='work'?'break':'work';f.left=f.phase==='break'?FOCUS_BREAK:FOCUS_WORK;f.end=null;fSet(f);render();break}
    case 'dh-set':S.set=b.dataset.v;render();break;
    case 'dh-tap':case 'dh-next':case 'dh-prev':{const k=S.set||defaultSet(),items=DHIKR[k].items,A=aGet(),p=A[k];
      if(a==='dh-prev'){p.i=Math.max(0,p.i-1);p.left=null}else if(a==='dh-next'){p.i=Math.min(items.length,p.i+1);p.left=null}
      else{const l=(p.left==null?items[p.i].n:p.left)-1;if(l<=0){p.i++;p.left=null}else p.left=l}
      S.set=k;aSet(A);render();if(p.i>=items.length){const i=PAGES.findIndex(x=>x[0]==='tasks');if(i>=0)setTimeout(()=>go(i),2500)}break}
    case 'dh-reset':{const k=S.set||defaultSet(),A=aGet();A[k]={i:0,left:null};aSet(A);render();break}
  }
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  if(f.dataset.form==='add'){const v=document.getElementById('newtask').value.trim();if(!v)return;const all=lsGet('ds-tasks',[])||[];
    const day=document.getElementById('newday')?.value||localDay(),time=document.getElementById('newtime')?.value||'',fut=day>localDay();
    all.push({id:uidMk(),title:v.slice(0,140),done:false,emoji:S.addEmo||guessEmo(v),date:fut?day:null,time:/^\d\d:\d\d$/.test(time)?time:'',cre:Date.now()});
    saveTasks(all);S.addEmo='';S.emoOpen=false;S.addDay=fut?day:null;document.getElementById('newtask').value='';S.clear=['newtask','newtime'];render();S.clear=null;document.getElementById('newtask')?.focus({preventScroll:true});
    if(fut)toast('انضافت ليوم '+WD_AR[new Date(Date.parse(day)).getUTCDay()]+' '+gStr(Date.parse(day)));return}
  if(f.dataset.form==='settings'){const pick=id=>document.querySelector(`#${id} [aria-pressed="true"]`)?.dataset.v;
    const chk=id=>!!document.getElementById(id)?.checked,pd={};
    for(const k of ['birthday','school','holiday','graduation']){const v=document.getElementById('s-pd-'+k)?.value||'';if(/^\d{4}-\d\d-\d\d$/.test(v))pd[k]=v}
    const occ=[...document.querySelectorAll('input[name="occ"]')].filter(i=>i.checked).map(i=>i.value),wf=+document.getElementById('s-wf').value,wt=+document.getElementById('s-wt').value;
    ST={...S.draft,name:document.getElementById('s-name').value.trim().slice(0,30),city:document.getElementById('s-city').value,method:pick('s-method')||'uq',theme:pick('s-theme')||'auto',clock:pick('s-clock')||'12',
      palette:pick('s-pal')||ST.palette,adhan:pick('s-adhan')||'aqsa',fajr:pick('s-fajr')||'same',pre:+(pick('s-pre')||0),click:pick('s-click')||'pop',nudge:+(pick('s-nudge')||0),
      work:wf<wt?[wf,wt]:ST.work,dict:pick('s-dict')||'ar',occOn:pick('s-occon')!=='0',occ:occ.length===OCC.length?null:occ,pd,
      hijriTop:chk('s-hijriTop'),hijriTasks:chk('s-hijriTasks'),countdown:chk('s-countdown'),greet:chk('s-greet')};
    lsSet('ds-settings',ST);PAL=PALETTES[ST.palette]||PALETTES.navy;curDark=null;OB.key='';closeSettings();toast('انحفظت الإعدادات')}
});
document.addEventListener('change',async e=>{const id=e.target.id;
  if(id==='s-file'||id==='s-ffile'){const file=e.target.files&&e.target.files[0];if(!file)return;
    if(file.size>40*1024*1024){toast('الملف كبير، اختاري ملفاً أصغر من 40 ميجا');return}
    try{await idbPut(id==='s-file'?'adhan':'adhan-fajr',{blob:file,name:file.name});await loadAdhan();
      if(id==='s-file'){document.getElementById('s-fname').textContent='الملف الحالي: '+file.name;const b=document.querySelector('#s-adhan [data-v="file"]');if(b)b.click()}
      else{document.getElementById('s-ffname').textContent='ملف الفجر: '+file.name;const b=document.querySelector('#s-fajr [data-v="file"]');if(b)b.click()}
      toast('انحفظ الملف في هذا الجهاز')}catch(err){toast('ما قدرت أحفظ الملف في هذا المتصفح')}}
  else if(id==='n-file'){const fs=[...(e.target.files||[])];e.target.value='';if(fs.length)addFiles(fs)}
  else if(id==='s-restore'){const f=e.target.files&&e.target.files[0];e.target.value='';if(f)backupRestore(f)}
  else if(id==='s-prev'){S.occPrev=e.target.value||null;OB.key='';occRefresh();toast(S.occPrev?'المعاينة ظاهرة خلف الإعدادات، احفظي أو ألغي لرؤيتها كاملة':'رجعت الخلفية الأصلية')}});
document.addEventListener('input',e=>{const t=e.target;if(!S.edit||!document.getElementById('sheetwrap'))return;if(t.id==='ne-title'||t.id==='ne-text'||(t.dataset&&t.dataset.li!=null)){clearTimeout(nSaveT);nSaveT=setTimeout(noteFromSheet,350)}});
document.addEventListener('keydown',e=>{if(document.querySelector('.amb-sheet:not(.amb-inline)')||(AMB&&AMB.state.show))return;if(document.getElementById('sheetwrap')){if(e.key==='Escape')closeSettings();else if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.li!=null){e.preventDefault();document.querySelector('[data-a="ne-add"]')?.click()}return}
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('ncard')){e.preventDefault();openNote(e.target.dataset.id);return}if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
  if(e.key==='ArrowLeft'){go(S.page+1);e.preventDefault()}else if(e.key==='ArrowRight'){go(S.page-1);e.preventDefault()}});
document.addEventListener('pointerdown',e=>{if(e.target.closest('#page')&&!e.target.closest('input,textarea,select,audio,video,iframe,.emopick'))S.px={x:e.clientX,y:e.clientY}});
document.addEventListener('pointerup',e=>{const p=S.px;S.px=null;if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5){S.swiped=true;setTimeout(()=>S.swiped=false,300);go(S.page+(dx>0?1:-1))}});
document.addEventListener('wheel',e=>{if(Math.abs(e.deltaX)<Math.abs(e.deltaY))return;if(AMB&&(AMB.state.sheetOpen||AMB.state.show))return;const now=Date.now();if(now-S.wheelT<700)return;S.wheel+=e.deltaX;if(Math.abs(S.wheel)>90){S.wheelT=now;const d=S.wheel>0?-1:1;S.wheel=0;go(S.page+d)}},{passive:true});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){render();if(S.started)wake()}});
loadAdhan();render();setInterval(()=>tick(false),1000);
})();
</script>

    navigator.serviceWorker.register('./service-worker.js').catch(() => {});
  });
