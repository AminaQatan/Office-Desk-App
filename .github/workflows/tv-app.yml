# Builds the Office Desk TV app (Android TV / Google TV) from the tv-app folder (or a tv-app.zip)
# and puts it on the site as tv.apk: https://aminaqatan.github.io/Office-Desk-App/tv.apk
name: TV app

on:
  push:
    branches: [main]
    paths:
      - 'tv-app/**'
      - 'tv-app*.zip'
      - .github/workflows/tv-app.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: tv-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find the TV app project
        id: src
        run: |
          if [ -f tv-app/settings.gradle ]; then
            echo "dir=$GITHUB_WORKSPACE/tv-app" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          zip=$(ls tv-app*.zip 2>/dev/null | head -n 1)   # a phone may upload it as "tv-app (1).zip"
          if [ -z "$zip" ]; then
            echo "The TV app project is not in the repository yet."
            echo "dir=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          unzip -q -o "$zip" -d "$RUNNER_TEMP/src"
          echo "dir=$RUNNER_TEMP/src/tv-app" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        if: steps.src.outputs.dir != ''
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.src.outputs.dir != ''
        with:
          gradle-version: '8.9'

      - name: Build the APK
        if: steps.src.outputs.dir != ''
        working-directory: ${{ steps.src.outputs.dir }}
        run: gradle --no-daemon assembleRelease

      - name: Put tv.apk on the site
        if: steps.src.outputs.dir != ''
        env:
          APK: ${{ steps.src.outputs.dir }}/app/build/outputs/apk/release/app-release.apk
        run: |
          cp "$APK" tv.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tv.apk
          git commit -m "TV app: new tv.apk" || { echo "tv.apk did not change"; exit 0; }
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 10
          done
          exit 1

      - name: Rebuild the site
        if: steps.src.outputs.dir != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds"

      - name: Keep a copy in Releases
        if: steps.src.outputs.dir != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete tv-app --cleanup-tag -y || true
          gh release create tv-app tv.apk --title "Office Desk TV app" --notes "Android TV / Google TV app. Short link for the TV: aminaqatan.github.io/Office-Desk-App/tv.apk"

      - uses: actions/upload-artifact@v4
        if: steps.src.outputs.dir != ''
        with:
          name: tv-apk
          path: tv.apk
